  - name: english
    file: english.webp
    alt:
      en: "The same Home page in English, titled Apps installed in addon-console-proof, with Open links on each card and a 日本語 button in the header to switch back."
      ja: "英語表示に切り替えた Home。「Apps installed in addon-console-proof」の見出しで、各カードに Open のリンクがあり、ヘッダーには日本語に戻すボタンがあります。"
