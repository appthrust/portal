      ja: "日本語表示の Home。検索欄の下に、注意の印が付いた AI Gateway、Builder Console、Contacts、Directory、Embedding、社内ツールビルダー、Knowledge、LLM、Memo、Peer Bonus のカードが 3 列で並んでいます。"
